name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Nilai staging dari rancangan build. Bukan secret.
  NEXT_PUBLIC_APP_URL_PUBLIC: https://dev.agrabudi.id
  NEXT_PUBLIC_APP_URL_OUTLET: https://dev-outlet.agrabudi.id
  NEXT_PUBLIC_APP_URL_PORTAL: https://dev-portal.agrabudi.id
  NEXT_PUBLIC_DATA_SOURCE: mock
  VITE_APP_URL_PUBLIC: https://dev.agrabudi.id
  VITE_APP_URL_OUTLET: https://dev-outlet.agrabudi.id
  VITE_APP_URL_PORTAL: https://dev-portal.agrabudi.id
  VITE_DATA_SOURCE: mock
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
