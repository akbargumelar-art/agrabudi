name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Nilai staging dari rancangan build. Bukan secret.
  NEXT_PUBLIC_APP_URL_PUBLIC: https://dev.agrabudi.id
  NEXT_PUBLIC_APP_URL_OUTLET: https://dev-outlet.agrabudi.id
  NEXT_PUBLIC_APP_URL_PORTAL: https://dev-portal.agrabudi.id
  NEXT_PUBLIC_DATA_SOURCE: mock
  VITE_APP_URL_PUBLIC: https://dev.agrabudi.id
  VITE_APP_URL_OUTLET: https://dev-outlet.agrabudi.id
  VITE_APP_URL_PORTAL: https://dev-portal.agrabudi.id
  VITE_DATA_SOURCE: mock
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Tes integrasi API memakai MySQL sungguhan, versi LTS yang sama dengan target produksi.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agrabudi_test
          MYSQL_ROOT_PASSWORD: ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only
      TEST_DB_NAME: agrabudi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Build produksi: sumber data `api`, lalu pastikan data contoh tidak ikut ke bundel (PRD 3.3).
  build-api-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    env:
      NEXT_PUBLIC_DATA_SOURCE: api
      VITE_DATA_SOURCE: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundel produksi bebas akun dan data contoh
        run: |
          if grep -rlE "contoh123|CONTOH001|mockCuanProducts|Ilustrasi contoh" \
            apps/outlet-web/dist apps/portal-web/dist apps/public-web/.next/static apps/api/dist; then
            echo "Data contoh ditemukan di bundel mode api" >&2
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tanpa push)
        run: |
          docker build -f infra/docker/api.Dockerfile -t agrabudi-api:${{ github.sha }} .
          docker build -f infra/docker/public-web.Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL_PUBLIC=$NEXT_PUBLIC_APP_URL_PUBLIC \
            --build-arg NEXT_PUBLIC_APP_URL_OUTLET=$NEXT_PUBLIC_APP_URL_OUTLET \
            --build-arg NEXT_PUBLIC_APP_URL_PORTAL=$NEXT_PUBLIC_APP_URL_PORTAL \
            -t agrabudi-public:${{ github.sha }} .
          docker build -f infra/docker/web.Dockerfile \
            --build-arg VITE_APP_URL_PUBLIC=$VITE_APP_URL_PUBLIC \
            --build-arg VITE_APP_URL_OUTLET=$VITE_APP_URL_OUTLET \
            --build-arg VITE_APP_URL_PORTAL=$VITE_APP_URL_PORTAL \
            -t agrabudi-web:${{ github.sha }} .
      - name: Konfigurasi Nginx sah
        run: |
          docker run --rm -e PUBLIC_HOST=dev.agrabudi.id -e OUTLET_HOST=dev-outlet.agrabudi.id \
            -e PORTAL_HOST=dev-portal.agrabudi.id -e MEDIA_ORIGIN=https://dev.agrabudi.id \
            -e FORWARDED_PROTO=https --add-host api:127.0.0.1 --add-host public-web:127.0.0.1 \
            agrabudi-web:${{ github.sha }} sh -c '/docker-entrypoint.sh nginx -t'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
