# Diteruskan ke API. X-Forwarded-For DITIMPA dengan alamat klien yang dilihat Nginx (bukan
# ditambah), supaya header kiriman klien tidak bisa memalsukan IP untuk batas laju login.
# Bila ada proxy TLS lain di depan Nginx ini, atur set_real_ip_from/real_ip_header di server.
proxy_pass http://api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";
proxy_read_timeout 30s;
proxy_connect_timeout 5s;
# Unggahan terbesar: gambar website 5 MB (CV 2 MB), ditambah ruang untuk isian form.
client_max_body_size 6m;
